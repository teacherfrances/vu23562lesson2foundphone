<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12342a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grace's Phone">
<title>Grace's Phone</title>
<style>
:root{
  --fs:28px;
  --g:#1f4d3f; --g2:#2e6b57; --gl:#e3efe8;
  --och:#d4a12a; --ochd:#8a6510; --ochl:#fbf0d4;
  --cream:#f7f1e3; --card:#fffdf8; --ink:#1d2a26; --mute:#5b6b65;
  --ter:#c8643b; --ok:#2f8f5b; --okl:#dff2e6; --bad:#b8402f; --badl:#f8e1dc;
  --line:#ddd3bf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;background:#0d1412;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Carlito,system-ui,sans-serif;line-height:1.35;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.phone{position:relative;width:100vw;height:100vh;height:100dvh;max-width:440px;margin:0 auto;overflow:hidden;background:#12342a;display:flex;flex-direction:column}
@media (min-width:620px){.phone{height:min(920px,96vh);margin-top:2vh;border-radius:46px;border:12px solid #050807;box-shadow:0 30px 80px rgba(0,0,0,.6)}}

/* status bar */
.sbar{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:19px;font-weight:700;color:#fff;background:transparent;position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20}
.sbtns{display:flex;gap:8px}
.sbar.dark{color:var(--ink)}
.sbar .aa{min-width:58px;min-height:40px;border-radius:20px;background:rgba(255,255,255,.22);font-size:19px;font-weight:700}
.sbar.dark .aa{background:rgba(0,0,0,.08)}
.sbar .icons{letter-spacing:2px}
#scr{position:absolute;inset:0;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;background:var(--cream)}
#scr.wall{background:radial-gradient(120% 70% at 80% 0%,#e9b949 0%,#3f8a73 38%,#1f4d3f 75%,#12342a 100%)}

/* wallpaper and rain */
.wall{background:radial-gradient(120% 70% at 80% 0%,#e9b949 0%,#3f8a73 38%,#1f4d3f 75%,#12342a 100%);color:#fff}
.rain{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.rain i{position:absolute;top:-12%;width:2px;height:9%;background:linear-gradient(transparent,rgba(220,235,240,.55));animation:fall linear infinite}
@keyframes fall{to{transform:translateY(130vh)}}

/* lock */
.lock{flex:1;display:flex;flex-direction:column;align-items:center;padding:64px 20px 20px;position:relative;z-index:1;overflow-y:auto}
.lock .date{font-size:.75rem;opacity:.9;margin-top:6px}
.lock .big{font-size:3.2rem;font-weight:700;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.notif{width:100%;background:rgba(255,255,255,.16);border-radius:22px;padding:12px 16px;margin-top:16px;font-size:.75rem;backdrop-filter:blur(6px)}
.notif b{display:block;font-size:.7rem;opacity:.85}
.story{width:100%;background:rgba(0,0,0,.25);border-radius:22px;padding:14px 18px;margin-top:12px;font-size:.8rem}
.dots{display:flex;gap:16px;margin:18px 0 6px}
.dots span{width:22px;height:22px;border-radius:50%;border:3px solid #fff}
.dots span.on{background:#fff}
.dots.shake{animation:shake .4s}
.pin-hint{font-size:.72rem;text-align:center;min-height:1.2em;color:var(--ochl)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:340px;margin-top:10px}
.pad button{aspect-ratio:1.35;border-radius:50px;background:rgba(255,255,255,.18);font-size:1.15rem;font-weight:700;color:#fff;min-height:64px}
.pad button:active{background:rgba(255,255,255,.4)}
.pad .blank{visibility:hidden}

/* home */
.home{flex:1;display:flex;flex-direction:column;padding:56px 16px 16px;position:relative;z-index:1;overflow-y:auto}
.prog{background:rgba(0,0,0,.28);border-radius:22px;padding:12px 16px}
.prog .row{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-weight:700;gap:8px}
.bar{height:14px;border-radius:7px;background:rgba(255,255,255,.2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--och);border-radius:7px;transition:width .6s}
.chip{display:inline-block;background:var(--och);color:#2b1f00;border-radius:14px;padding:2px 10px;font-size:.7rem;font-weight:700}
.mission{margin-top:12px;background:var(--card);color:var(--ink);border-radius:22px;padding:12px 16px;font-size:.8rem;border-left:8px solid var(--och)}
.mission b{color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin-top:18px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-height:64px}
.app .ic{width:min(3rem,25vw);height:min(3rem,25vw);border-radius:26%;display:grid;place-items:center;font-size:min(1.7rem,14vw);box-shadow:0 6px 14px rgba(0,0,0,.3);position:relative}
.app .lb{font-size:max(.68rem,19px);font-weight:700;text-align:center;line-height:1.1;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.app .sc{font-size:19px;background:rgba(0,0,0,.35);border-radius:10px;padding:0 8px}
.app.locked .ic{filter:grayscale(.85) brightness(.55)}
.app .lockb{position:absolute;right:-6px;bottom:-6px;width:44%;height:44%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.8rem;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.app .tick{position:absolute;right:-6px;top:-6px;width:40%;height:40%;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:.7rem;font-weight:700;border:3px solid #fff}
.app.next .ic{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(212,161,42,.55),0 6px 14px rgba(0,0,0,.3)}}
.reset{margin-top:auto;padding-top:22px;text-align:center}
.reset button{font-size:.65rem;min-height:48px;padding:0 16px;border-radius:24px;background:rgba(255,255,255,.12);color:#fff}
.warn{margin-top:10px;background:var(--ochl);color:#4a3600;border-radius:16px;padding:8px 12px;font-size:.65rem}

/* app screen */
.appbar{flex:0 0 auto;padding:52px 10px 10px;display:flex;align-items:center;gap:8px;color:#fff}
.appbar .back{min-height:56px;padding:0 14px;border-radius:28px;background:rgba(255,255,255,.18);font-weight:700;font-size:.8rem}
.appbar h1{margin:0;font-size:1rem;flex:1;text-align:right;padding-right:6px}
.ctx{flex:1 1 0;min-height:0;overflow-y:auto;padding:14px;background:var(--cream);-webkit-overflow-scrolling:touch}
.qp{flex:1 1 0;min-height:0;overflow-y:auto;background:var(--card);border-top:3px solid var(--line);padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 20px rgba(0,0,0,.08)}
.qnum{font-size:max(.65rem,19px);color:var(--mute);font-weight:700}
.q{font-size:1rem;font-weight:700;margin:4px 0 10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;min-height:64px;border-radius:18px;border:3px solid var(--line);background:#fff;font-size:1rem;text-align:left;padding:10px 16px;font-family:Georgia,"Times New Roman",serif}
.opt:active{transform:scale(.98)}
.opt.right{background:var(--okl);border-color:var(--ok)}
.opt.wrong{background:var(--badl);border-color:var(--bad);opacity:.75;animation:shake .4s}
.fb{font-size:.8rem;margin-top:10px;min-height:1em}
.fb.ok{color:var(--ok);font-weight:700}
.fb.no{color:var(--bad)}
.go{width:100%;min-height:64px;border-radius:32px;background:var(--g);color:#fff;font-weight:700;font-size:1rem;margin-top:12px}
.go.och{background:var(--och);color:#2b1f00}
.go[disabled]{opacity:.4}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.intro{background:var(--card);border-radius:22px;padding:16px;font-size:.9rem;border-left:8px solid var(--och);font-family:Georgia,"Times New Roman",serif}
.intro p{margin:0 0 10px}
.intro .when{font-family:"Trebuchet MS",sans-serif;font-weight:700;color:var(--g);font-size:.75rem}

/* tile builder */
.tray{display:flex;flex-wrap:wrap;gap:10px}
.tile{min-height:60px;padding:8px 16px;border-radius:16px;background:var(--ochl);border:3px solid var(--och);font-weight:700;font-size:.9rem}
.tile.used{visibility:hidden}
.small-btns{display:flex;gap:10px;margin-top:10px}
.small-btns button{flex:1;min-height:60px;border-radius:30px;font-weight:700;font-size:.85rem;background:var(--gl);color:var(--g)}

/* maps app */
.msearch{background:#fff;border-radius:30px;padding:10px 16px;min-height:64px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;box-shadow:0 3px 10px rgba(0,0,0,.12);font-size:.85rem}
.msearch .ph{color:var(--mute)}
.msearch .pt{background:var(--gl);border:2px solid var(--g2);color:var(--g);border-radius:12px;padding:4px 10px;font-weight:700;min-height:48px;font-size:.85rem}
.msearch .cur{width:3px;height:1.1em;background:var(--g);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.recent{margin-top:12px;background:#fff;border-radius:18px;padding:10px 14px;font-size:.75rem;color:var(--mute)}
.recent b{color:var(--ink)}
.map{position:relative;height:9rem;min-height:230px;margin-top:12px;border-radius:20px;overflow:hidden;background:#e7eedd;background-image:linear-gradient(#dfe8d3 2px,transparent 2px),linear-gradient(90deg,#dfe8d3 2px,transparent 2px);background-size:40px 40px}
.road{position:absolute;background:#fff;box-shadow:0 0 0 2px #cfd6c4}
.road.v{top:0;bottom:0;width:30px}
.road.h{left:0;right:0;height:26px}
.road span{position:absolute;font-size:19px;font-weight:700;color:#6b746a;white-space:nowrap}
.road.v span{transform:rotate(-90deg);transform-origin:left top;left:4px;top:70%}
.road.h span{left:8px;top:1px}
.park{position:absolute;left:62%;top:6%;width:30%;height:26%;background:#bfdcae;border-radius:14px}
.mpin{position:absolute;font-size:1.4rem;transform:translate(-50%,-90%)}
.mstop{position:absolute;font-size:1rem;transform:translate(-50%,-50%)}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.zoom span.z{width:44px;height:44px;background:#fff;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:26px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.locb{position:absolute;right:10px;bottom:10px;width:48px;height:48px;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:26px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tag{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:var(--och);color:#fff;font-weight:700;font-size:19px;font-family:"Trebuchet MS",sans-serif;flex:0 0 auto}
.map .tag{position:absolute}
.mcard{margin-top:12px;background:#fff;border-radius:20px;padding:12px 14px;font-size:.8rem;display:flex;gap:10px}
.mcard small{display:block;color:var(--mute);font-size:max(.68rem,19px);margin-top:4px}
.mbtns{display:flex;gap:10px;margin-top:10px}
.mbtns span.b{flex:1;display:flex;align-items:center;gap:8px;justify-content:center;background:var(--g);color:#fff;border-radius:26px;min-height:56px;font-weight:700;font-size:.8rem}
.mbtns span.b.alt{background:#fff;color:var(--g);border:2px solid var(--g)}

/* messages */
.thread{display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 12px;margin-bottom:6px}
.av{width:52px;height:52px;border-radius:50%;background:var(--ter);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:0 0 auto}
.who b{font-size:.9rem}
.who small{display:block;color:var(--mute);font-size:max(.62rem,19px)}
.bub{max-width:86%;padding:10px 14px;border-radius:22px;font-size:.85rem;font-family:Georgia,"Times New Roman",serif}
.bub.them{background:#fff;align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:#3b8a5e;color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.tstamp{align-self:center;font-size:19px;color:var(--mute)}
.reveal .bub{animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}

/* timetable */
.nowbox{background:var(--g);color:#fff;border-radius:18px;padding:10px 14px;font-size:.8rem}
.nowbox b{color:#ffe7a8}
.ttwrap{margin-top:12px;background:#fff;border-radius:18px;overflow:hidden;border:2px solid var(--line)}
.tthead{background:var(--och);color:#2b1f00;padding:10px 14px;font-weight:700;font-size:.85rem}
.tthead small{display:block;font-weight:400;font-size:max(.62rem,19px)}
.ttscroll{overflow-x:auto}
table.tt{border-collapse:collapse;font-size:max(.7rem,20px);min-width:100%}
.tt th,.tt td{padding:10px 10px;border-bottom:1px solid #eee3cc;white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums}
.tt th{background:#fbf6ea;font-size:max(.62rem,19px)}
.tt th.day{background:var(--gl);color:var(--g)}
.tt td:first-child,.tt th:first-child{position:sticky;left:0;background:#fff;text-align:left;font-weight:700;white-space:normal;min-width:7em;box-shadow:2px 0 0 #eee3cc}
.tt th:first-child{background:#fbf6ea}
.ttnote{padding:10px 14px;font-weight:700;color:var(--ter);font-size:max(.7rem,20px)}
.practice{font-size:max(.62rem,19px);color:var(--mute);margin-top:10px;text-align:center}

/* overlay */
.ov{position:absolute;inset:0;z-index:40;background:rgba(10,25,20,.7);display:flex;align-items:center;justify-content:center;padding:18px}
.ovc{background:var(--card);border-radius:28px;padding:22px 18px;width:100%;text-align:center;animation:pop .4s both;max-height:90%;overflow-y:auto}
.ovc .bigi{font-size:2.4rem}
.ovc h2{margin:6px 0;color:var(--g);font-size:1.15rem}
.ovc p{font-size:.85rem;margin:8px 0;font-family:Georgia,"Times New Roman",serif}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:50;background:#111;color:#fff;padding:10px 18px;border-radius:24px;font-size:.75rem;animation:pop .3s both;max-width:90%;text-align:center}

/* voice */
.vcard{background:#fff;border-radius:22px;padding:16px;text-align:center}
.vcard .mic{width:2.6rem;height:2.6rem;border-radius:50%;background:linear-gradient(145deg,#d87850,#a14a27);color:#fff;display:grid;place-items:center;font-size:1.3rem;margin:0 auto}
.wave{display:flex;gap:5px;justify-content:center;align-items:center;height:70px;margin:12px 0}
.wave i{width:8px;border-radius:4px;background:var(--ter);animation:wv 1s ease-in-out infinite alternate}
@keyframes wv{from{transform:scaleY(.35)}}
.tip{background:var(--ochl);border-radius:18px;padding:10px 14px;margin-top:12px;font-size:.8rem;text-align:left}
.tip b{color:var(--ochd)}
/* gap chat */
.gap{display:inline-block;min-width:4.5em;border-bottom:3px dashed currentColor;margin:0 4px}
/* notes */
.paper{background:#fffbe9;border-radius:18px;padding:14px 16px;background-image:repeating-linear-gradient(#fffbe9 0,#fffbe9 calc(1.6em - 2px),#eadfb8 calc(1.6em - 2px),#eadfb8 1.6em);line-height:1.6em;font-family:Georgia,"Times New Roman",serif;font-size:.85rem}
.paper h3{margin:0;font-family:"Trebuchet MS",sans-serif;color:var(--ochd);font-size:.95rem;line-height:1.6em}
.paper .done{color:var(--ink)}
.paper .done b{color:var(--ok)}
.paper .now{color:var(--mute)}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,5.5em),1fr));gap:8px;margin-top:12px}
.rule div{min-width:0;overflow-wrap:break-word}
.rule div{background:#fff;border-radius:16px;padding:10px 12px;font-size:max(.68rem,19px)}
.rule b{display:block;color:var(--g);font-size:max(.72rem,20px)}
/* cards */
.ocard{border-radius:22px;padding:16px;color:#fff;background:linear-gradient(135deg,#2b2b2b,#4a4a4a);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.ocard .ot{font-weight:700;font-size:1rem}
.ocard .bal{font-size:1.4rem;font-weight:700;margin-top:6px}
.ocard small{display:block;opacity:.8;font-size:max(.65rem,19px)}
.oform{background:#fff;border-radius:20px;padding:12px 14px;margin-top:12px}
.oform h4{margin:0 0 8px;color:#28506b;font-size:.85rem}
.lowbal{color:#ffd27a;font-weight:700}
/* photos */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:10px}
.gal span{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:1.2rem;background:#d9e3dc}
.gal span.sel{outline:4px solid var(--och)}
.leaf{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.15);transform:rotate(-.6deg)}
.leaf .lh{background:#1f4d6b;color:#fff;padding:12px 14px}
.leaf .lh b{display:block;font-size:1.05rem;letter-spacing:1px}
.leaf .lh small{font-size:max(.62rem,19px);opacity:.85}
.leaf .lb2{padding:10px 14px;font-size:max(.72rem,20px);font-family:Georgia,"Times New Roman",serif}
.leaf .lb2 p{margin:0 0 8px}
.leaf .lb2 b{font-family:"Trebuchet MS",sans-serif;color:#1f4d6b}
.leaf table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(19px,.72rem,22px);margin-bottom:6px}
.leaf th,.leaf td{overflow-wrap:break-word}
.leaf th{background:#e6eef3;color:#1f4d6b;padding:8px;text-align:left}
.leaf td{padding:8px;border-bottom:1px solid #e6eef3}
/* polls */
.poll{background:#fff;border-radius:20px;padding:14px}
.poll h4{margin:0 0 10px;font-size:.9rem;color:#6a3f7d}
.prow{display:grid;grid-template-columns:5em 1fr 1.6em;align-items:center;gap:8px;margin:8px 0;font-size:max(.72rem,20px);font-weight:700}
.prow .pb{height:22px;border-radius:11px;background:#efe6f3;overflow:hidden}
.prow .pb i{display:block;height:100%;background:#9a6aac;border-radius:11px}
.stmt{background:#fff;border-radius:18px;padding:12px 14px;margin-top:12px;font-family:Georgia,"Times New Roman",serif;font-size:.9rem;border-left:8px solid #9a6aac}
.stmt b{font-family:"Trebuchet MS",sans-serif;color:#6a3f7d;display:block;font-size:max(.7rem,20px)}
/* class */
.room{background:#fff;border-radius:20px;padding:14px;text-align:center}
.room .board{background:#2c4a3e;color:#fff;border-radius:12px;padding:10px;font-size:max(.72rem,20px);border:6px solid #b98a52}
/* win */
.win{flex:1;display:flex;flex-direction:column;align-items:center;padding:60px 18px 20px;overflow-y:auto;position:relative;z-index:1;text-align:center}
.win h2{font-size:1.4rem;margin:6px 0;color:#ffe7a8}
.win .trophy{font-size:3.4rem;animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px) rotate(-4deg)}}
.win .card2{background:var(--card);color:var(--ink);border-radius:22px;padding:14px;width:100%;margin-top:12px;text-align:left}
.win .total{font-size:1.1rem;font-weight:700;color:var(--g);text-align:center}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:.8rem}
.srow:last-child{border-bottom:0}
.stars{color:var(--och);letter-spacing:2px}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.conf i{position:absolute;top:-5%;width:12px;height:18px;border-radius:3px;animation:cf linear infinite}
@keyframes cf{to{transform:translateY(115vh) rotate(720deg)}}
/* welcome back + tips */
.wb{background:var(--och);color:#2b1f00;border-radius:22px;padding:12px 16px;margin-bottom:12px;font-size:.8rem;box-shadow:0 6px 16px rgba(0,0,0,.3);animation:pop .4s both}
.wb .wbt{font-weight:700;font-size:.85rem;letter-spacing:1px}
.wb button{margin-top:8px;min-height:52px;padding:0 26px;border-radius:26px;background:#2b1f00;color:#fff;font-weight:700;font-size:.8rem}
.tipb{background:var(--card)}
.app .sc.keep{background:var(--och);color:#2b1f00;font-weight:700;text-shadow:none}
.home,.lock,.win{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))!important}
.rotate{display:none;position:fixed;inset:0;z-index:100;background:#12342a;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:700}

<script>
(function(){

/* ===================== 1. CONTENT ===================== */

 {n:"Messages",i:"💬",c:"#5cc77a,#2e9a4f"},

  '<div class="tip"><b>Strong syllable</b><br>Long words have one strong syllable. It\'s louder and longer. In this app it\'s in CAPITALS.</div>'+
  '<div class="tip"><b>Numbers and emails</b><br>Say numbers in groups. 77 is "double seven". 888 is "triple eight". @ is "at", . is "dot", - is "dash".</div>';

var NOTES=[
 ["Last Thursday Scarlett ___ to the conversation group.","went",["goes","is going to go"],"Last Thursday is finished. Use the past simple."],
 ["The library ___ at 9 am on weekdays.","opens",["opened","is going to open"],"Opening times are facts. Use the simple present."],

 ["Yesterday we ___ cards with our neighbours.","played",["play","are going to play"],"Yesterday is finished. Use the past simple."],
 ["I ___ a class last week. It was full.","didn't book",["don't book","didn't booked"],"didn't + the base verb."],
 ["I ___ to the pool on Mondays. (usually)","usually go",["go usually","usually goes"],"usually goes before the main verb."],
 ["I ___ yoga at the community centre.","do",["play","go"],"do + classes: do yoga, do tai chi."],

];

 var it=PUZ[S.app].items[S.item], key=S.app+"-"+S.item, b=S.opt[key][d];
 if(b===0){
  answered=true; btn.classList.add("right");
  document.querySelectorAll(".opt").forEach(function(o){ o.disabled=true; });
  showNext(it.ok);
 } else {
  btn.classList.add("wrong"); btn.disabled=true; markWrong(key);
  var fb=$("fb"); fb.className="fb no"; fb.textContent="Not quite. "+it.hint;
 }
}
function tapTile(b){
 if(answered) return;
 if(placed.indexOf(b)<0){ placed.push(b); drawOrder(); }
}
function checkOrder(){
 if(answered) return;
 var it=PUZ[S.app].items[S.item], key=S.app+"-"+S.item, fb=$("fb");
 var good=placed.length===it.tiles.length && placed.every(function(b,i){ return b===i; });
 if(good){ answered=true; showNext(it.ok); }
 else{
  markWrong(key); fb.className="fb no";
  fb.textContent=(placed.length<it.tiles.length?"The address isn't finished. ":"Not quite. ")+it.hint;
  var ms=$("ms"); ms.style.animation="none"; void ms.offsetWidth; ms.style.animation="shake .4s";
 }
}
function nextItem(){
 var p=PUZ[S.app];
 if(S.item<p.items.length-1){ S.item++; save(); renderApp(); var c=$("ctx"); if(c) c.scrollTop=0; return; }
 /* app finished */
 var ai=S.app, firstTry=0;
 for(var i=0;i<p.items.length;i++) if(!S.wrong[ai+"-"+i]) firstTry++;
 S.score[ai]=Math.max(S.score[ai]||0,firstTry);
 var isNew = ai===S.done;
 if(isNew) S.done++;
 S.app=-1; S.curApp=-1; save();
 if(isNew && S.done===APPS.length){ renderWin(); return; }
 setBar(false);
 var ov=document.createElement("div"); ov.className="ov";
 ov.innerHTML='<div class="ovc"><div class="bigi">🔓</div><h2>'+APPS[ai].n+' unlocked!</h2>'+
  '<p><b>Apps unlocked: '+S.done+'/'+APPS.length+'</b></p>'+
  '<p>Right first time: '+firstTry+' out of '+p.items.length+'</p>'+
  '<p>'+p.done+'</p><p>🕘 Now it\'s '+p.after+' am.</p>'+
  '<button class="go" data-act="home">Go to the home screen</button></div>';
 $("phone").appendChild(ov);
}

function renderWin(){
 S.app=-1; save();
 $("clock").textContent="10:15"; sbar.className="sbar";
 scr.className="wall"; scr.style.background="";
 var cols=["#d4a12a","#c8643b","#5cc77a","#8a9fc8","#fff","#9a6aac"], c='<div class="conf" aria-hidden="true">';
 for(var i=0;i<60;i++) c+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;background:'+cols[i%cols.length]+';animation-duration:'+(2.2+Math.random()*2.5).toFixed(2)+'s;animation-delay:'+(-Math.random()*4).toFixed(2)+'s"></i>';
 c+='</div>';
 var tot=0, max=0, rows='';
 PUZ.forEach(function(p,i){
  var sc=S.score[i]||0, n=p.items.length; tot+=sc; max+=n;
  var st=sc===n?"★★★":sc>=n-2?"★★☆":"★☆☆";
  rows+='<div class="srow"><span>'+APPS[i].i+' '+APPS[i].n+'</span><span><span class="stars">'+st+'</span> '+sc+'/'+n+'</span></div>';
 });
 var pc=tot/max, msg = pc>=0.9?"Amazing work! You're a real local now.": pc>=0.7?"Great job! You know your way around.":"Good effort! Play again to beat your score.";
 scr.innerHTML=c+'<div class="win"><div class="trophy">📚</div><h2>You found your place!</h2>'+
  '<div style="font-size:.85rem">It\'s 10:15. You\'re at the conversation group.<br>Scarlett introduces you to everyone. 👋</div>'+
  '<div class="card2"><div class="total">Right first time: '+tot+' out of '+max+'</div><p style="text-align:center;margin:6px 0 10px;font-size:.8rem">'+msg+'</p>'+rows+'</div>'+
  '<div class="card2"><b>Today you can:</b><br>✓ use everyday expressions about going out<br>✓ say service words, hours, phone numbers and emails<br>✓ use the simple present, past simple and be going to<br>✓ say where a place is with prepositions<br>✓ read notices and a community website<br>✓ say where you found information<br>✓ write a message and answer questions about a place</div>'+
  '<button class="go och" data-act="home" style="margin-top:14px">Back to the home screen</button>'+
  '<div class="reset"><button data-act="reset" id="rb">↺ Play again from the start</button></div></div>';
 resetArm=false;
}

function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement; }
function canFS(){ var d=document.documentElement; return !!(d.requestFullscreen || d.webkitRequestFullscreen) && !/iPhone|iPod/.test(navigator.userAgent); }
function toggleFS(){
 var d=document.documentElement;
 try{
  if(fsEl()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
  var r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);
  if(r && r.then) r.then(function(){ try{ screen.orientation.lock("portrait").catch(function(){}); }catch(e){} }).catch(function(){ toast("Full screen is not available here."); });
 }catch(e){ toast("Full screen is not available here."); }
}
if(canFS() && !STANDALONE) $("fsb").hidden=false;

/* ===================== 7. EVENTS ===================== */
var lastDraw=0;
new MutationObserver(function(){ lastDraw=Date.now(); }).observe(document.getElementById("scr"),{childList:true});
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-act]"); if(!t) return;
 if(Date.now()-lastDraw<300 && /^(mc|tile|next|search)$/.test(t.getAttribute("data-act"))) return;
 var act=t.getAttribute("data-act");
 if(act==="size"){ S.fs=(S.fs+1)%SIZES.length; applySize(); save(); return; }
 if(act==="key"){ pressKey(t.getAttribute("data-k")); return; }
 if(act==="open"){ openApp(+t.getAttribute("data-i")); return; }
 if(act==="home"){ var ov=document.querySelector(".ov"); if(ov) ov.remove(); scr.style.background=""; renderHome(); return; }
 if(act==="start"){ S.introOK=true; save(); renderApp(); return; }
 if(act==="mc"){ answerMC(+t.getAttribute("data-d"),t); return; }
 if(act==="tile"){ tapTile(+t.getAttribute("data-b")); return; }
 if(act==="undo"){ if(!answered){ placed.pop(); drawOrder(); $("fb").textContent=""; } return; }
 if(act==="search"){ checkOrder(); return; }
 if(act==="next"){ nextItem(); return; }
 if(act==="win"){ renderWin(); return; }
 if(act==="wbx"){ var w=$("wb"); if(w) w.remove(); return; }
 if(act==="tipx"){ S.tipDone=true; save(); var tb=$("tipb"); if(tb) tb.remove(); return; }
 if(act==="fs"){ toggleFS(); return; }
 if(act==="reset"){
  if(!resetArm){ resetArm=true; t.textContent="Tap again to start again"; setTimeout(function(){ resetArm=false; var r=$("rb"); if(r) r.textContent="↺ Start the whole game again"; },3000); return; }
  var fs=S.fs; S=fresh(); S.fs=fs; save(); pin=""; pinWrong=0; SEEN_CHAT=false; renderLock(); return;
 }
});

/* ===================== 8. START ===================== */
if(S.app>=0 && S.curApp<0) S.curApp=S.app;   /* older saves */
if(!S.prog) S.prog={};
S.app=-1;
WELCOME = S.pass && (S.done>0 || S.curApp>=0);
if(!S.pass) renderLock(); else renderHome();
})();
</script>
</body>
</html>
